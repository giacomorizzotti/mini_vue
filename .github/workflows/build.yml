name: Build

on:
  push:
  pull_request:

jobs:
  barrels:
    name: Both barrels build without vue-i18n
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Link the repo in as src/mini, like a consuming project
        run: mkdir -p src && ln -s ../.. src/mini
      - run: npm run build
